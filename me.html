<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta property="og:url" content="https://cdn.sankhacooray.com/me">
<meta property="og:image" content="https://cdn.sankhacooray.com/assets/og-image.png">

<meta property="og:locale" content="en_US">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Count me out">
<meta name="twitter:description" content="Owner switch for the sankhacooray.com network: stop Google Analytics counting this browser on every subdomain.">
<meta name="twitter:image" content="https://cdn.sankhacooray.com/assets/og-image.png">
<meta name="twitter:image:alt" content="cdn.sankhacooray.com — shared front-end components for the network">
<link rel="icon" type="image/svg+xml" href="assets/icon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a0a12">
<style>
  :root { --accent:#7c9cff; --bg:#f6f6fa; --card:#ffffff; --ink:#14141c; --ink-2:#5a5a6e; --good:#0a8a3a; --off:#9a9aae; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#0a0a12; --card:#14141e; --ink:#e8e8f2; --ink-2:#a0a0b8; --good:#37d67a; --off:#6a6a80; }
  }
  :root[data-theme="dark"] { --bg:#0a0a12; --card:#14141e; --ink:#e8e8f2; --ink-2:#a0a0b8; --good:#37d67a; --off:#6a6a80; }
  html, body { margin:0; height:100%; background:var(--bg); overscroll-behavior:none; }
  body { color:var(--ink); font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         display:flex; flex-direction:column; }
  main { margin:auto; padding:24px 16px; width:100%; max-width:440px; box-sizing:border-box; }
  .card { background:var(--card); border-radius:18px; padding:28px; box-shadow:0 2px 6px rgba(0,0,0,.06), 0 12px 32px rgba(0,0,0,.08); }
  .eyebrow { color:var(--ink-2); font-size:13px; margin:0 0 6px; }
  h1 { font-size:24px; line-height:1.25; margin:0 0 10px; display:flex; align-items:center; gap:10px; }
  .dot { width:12px; height:12px; border-radius:50%; background:var(--off); flex:none; }
  .dot.on { background:var(--good); }
  p { color:var(--ink-2); margin:0 0 20px; }
  button.cta { width:100%; height:46px; border:0; border-radius:999px; background:var(--accent); color:#fff;
               font:600 15px system-ui,-apple-system,sans-serif; cursor:pointer; }
  button.cta:hover { filter:brightness(1.08); box-shadow:0 0 0 4px rgba(124,156,255,.25); }
  button.cta.quiet { background:transparent; color:var(--ink-2); box-shadow:inset 0 0 0 1.5px var(--off); }
  ul { color:var(--ink-2); font-size:13px; padding-left:18px; margin:20px 0 0; }
  li { margin:4px 0; }
  .theme { position:fixed; top:14px; right:14px; width:34px; height:34px; border-radius:50%; border:0;
           background:var(--card); color:var(--ink-2); cursor:pointer; display:grid; place-items:center;
           box-shadow:0 2px 8px rgba(0,0,0,.1); }
  .theme svg { width:16px; height:16px; }
  .theme .sun { display:none; }
  :root[data-theme="dark"] .theme .sun { display:block; } :root[data-theme="dark"] .theme .moon { display:none; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .theme .sun { display:block; } :root:not([data-theme="light"]) .theme .moon { display:none; }
  }
</style>
</head>
<body>
<button class="theme" id="theme" aria-label="Switch theme">
  <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
</button>
<main>
  <div class="card">
    <p class="eyebrow">sankhacooray.com analytics</p>
    <h1><span class="dot" id="dot"></span><span id="status">Checking…</span></h1>
    <p id="detail"></p>
    <button class="cta" id="toggle"></button>
    <ul>
      <li>Covers every *.sankhacooray.com site in this browser.</li>
      <li>Do it once on each browser and device you use.</li>
      <li>Private windows and cleared cookies start counting again.</li>
      <li>Safari forgets it after 7 days without a visit to any of the sites.</li>
    </ul>
  </div>
</main>
<script>
(function () {
  // Same cookie the shared sankha-analytics.js checks before loading GA.
  var NAME = 'sankha_me';
  function isMe() { return new RegExp('(?:^|;\\s*)' + NAME + '=1').test(document.cookie); }
  function setMe(on) {
    document.cookie = NAME + '=' + (on ? '1' : '') + '; domain=.sankhacooray.com; path=/; max-age=' +
      (on ? 400 * 86400 : 0) + '; SameSite=Lax; Secure';
  }
  function render() {
    var me = isMe();
    document.getElementById('dot').className = 'dot' + (me ? ' on' : '');
    document.getElementById('status').textContent = me ? 'This browser is not counted' : 'This browser is counted';
    document.getElementById('detail').textContent = me
      ? 'Your visits on this browser are left out of Google Analytics.'
      : 'Your visits on this browser show up in Google Analytics like any other visitor.';
    var b = document.getElementById('toggle');
    b.textContent = me ? 'Count this browser again' : 'Stop counting this browser';
    b.className = 'cta' + (me ? ' quiet' : '');
  }
  var m = /[?&]me=(on|off)\b/.exec(location.search);
  if (m) setMe(m[1] === 'on');
  else if (isMe()) setMe(true);   // refresh the expiry
  document.getElementById('toggle').onclick = function () { setMe(!isMe()); render(); };

  var root = document.documentElement;
  try { var t = localStorage.getItem('theme'); if (t) root.setAttribute('data-theme', t); } catch (e) {}
  function dark() { var t = root.getAttribute('data-theme'); return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; }
  function label() { document.getElementById('theme').setAttribute('aria-label', dark() ? 'Switch to light theme' : 'Switch to dark theme'); }
  document.getElementById('theme').onclick = function () {
    var next = dark() ? 'light' : 'dark'; root.setAttribute('data-theme', next);
    try { localStorage.setItem('theme', next); } catch (e) {} label();
  };
  label(); render();
})();
</script>
</body>
</html>
